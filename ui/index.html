<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashcam Viewer</title>

  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/viewer.css" />
</head>
<body>
  <header></header>

  <div class="app" id="app">
    <aside class="drawer" id="drawer">
      <div class="drawer-tabs">
        <button type="button" class="tab active" data-tab="drives">Drives</button>
        <button type="button" class="tab" data-tab="events">Events <span class="n" id="eventCount"></span></button>
        <button type="button" class="drawer-collapse" id="drawerToggle" title="Hide the side panel">◀</button>
      </div>

      <section class="tab-panel active" id="tab-drives">
        <div class="session-filters">
          <label>Vehicle
            <select id="vehicleFilter"><option value="">All</option></select>
          </label>
          <label>From <input type="date" id="dateFrom" /></label>
          <label>To <input type="date" id="dateTo" /></label>
        </div>
        <div class="session-table-wrap grow">
          <table class="session-table">
            <thead>
              <tr>
                <th data-col="vehicle_tag">Veh</th>
                <th data-col="start_ts_utc">Date</th>
                <th data-col="duration_s">Time</th>
                <th data-col="distance_mi">Dist</th>
              </tr>
            </thead>
            <tbody id="sessionTableBody"></tbody>
          </table>
        </div>
        <div class="session-status" id="sessionStatus">Loading&hellip;</div>
      </section>

      <section class="tab-panel" id="tab-events">
        <div class="chips" id="eventChips"></div>
        <div class="event-focus" id="eventFocus" hidden></div>
        <div class="events grow" id="eventList"></div>
      </section>
    </aside>

    <button type="button" class="rail" id="drawerExpand" title="Show the side panel">▶</button>

    <main class="main">
      <div class="strip" id="summaryStrip"><span class="muted">Pick a drive from the list.</span></div>

      <div class="map-wrap">
        <div id="map"></div>
        <div class="legend" id="speedLegend" title="Route colour is speed">
          <span>0</span><span class="bar"></span><span>60+ mph</span>
        </div>
        <div class="pip" id="pip" hidden>
          <img id="pipImg" alt="" />
          <div class="pip-cap">
            <span class="t mono" id="pipTime"></span>
            <span class="muted" id="pipSpeed"></span>
            <a id="pipOpen" href="#" target="_blank" title="Open the full-size still">open</a>
          </div>
        </div>
        <div class="hovercard" id="hoverCard" hidden>
          <img id="hoverImg" alt="" />
          <div class="cap mono" id="hoverCap"></div>
        </div>
      </div>

      <div class="filmstrip-bar">
        <div class="transport">
          <button type="button" id="btnFirst" title="First still (Home)" disabled>|◀</button>
          <button type="button" id="btnPrev" title="Previous still (←)" disabled>◀</button>
          <button type="button" id="btnPlay" class="play" title="Play (Space)" disabled>▶</button>
          <button type="button" id="btnNext" title="Next still (→)" disabled>▶</button>
          <button type="button" id="btnLast" title="Last still (End)" disabled>▶|</button>
          <select id="rate" title="Playback speed">
            <option value="1">1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
          </select>
          <span class="small" id="stillCount">—</span>
          <span class="now" id="nowLine">—</span>
        </div>
        <div class="filmstrip" id="filmstrip"></div>
      </div>

      <div class="timeline"><div id="chart"></div></div>
    </main>
  </div>

  <script type="module" src="js/viewer.js"></script>
</body>
</html>
