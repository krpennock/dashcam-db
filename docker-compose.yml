services:
  db:
    image: postgis/postgis:16-3.5
    container_name: dashcam-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    ports:
      - "5432:5432"
    # Parallel maintenance (VACUUM, index builds) needs more than Docker's
    # default 64 MB of shared memory, or it fails with "could not resize shared
    # memory segment".
    shm_size: 1gb
    volumes:
      - dashcam_db:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: dashcam-api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8000:8000"
    volumes:
      - ./media:/media:ro
    depends_on:
      db:
        condition: service_healthy

  ui:
    image: nginx:alpine
    container_name: dashcam-ui
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./ui:/usr/share/nginx/html:ro
      - ./ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started

  # Watches the import tree and loads whatever the PC ships in.
  importer:
    build: ./ingest
    container_name: dashcam-importer
    restart: unless-stopped
    entrypoint: ["python", "-m", "importer.run"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      IMPORT_ROOT: /import
      MEDIA_ROOT: /media
      IMPORTER_POLL_SECONDS: "15"
      IMPORTER_MIN_FREE_GB: "10"
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      VIEWER_URL: ${VIEWER_URL:-}
      TZ: ${TZ}
    volumes:
      # Read-write, unlike the one-off ingest service: this one files drive
      # folders into done/ and failed/ as it goes.
      - ${IMPORT_ROOT:-./import}:/import:rw
      - ./media:/media:rw
    depends_on:
      db:
        condition: service_healthy

  # Phone notifications. Self-hosted, with ntfy.sh as a relay so an iPhone can be
  # woken; the message itself still comes from here.
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: dashcam-ntfy
    restart: unless-stopped
    command: ["serve"]
    environment:
      TZ: ${TZ}
    ports:
      - "8090:80"
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy_data:/var/lib/ntfy

  ingest:
    build: ./ingest
    profiles: ["tools"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${IMPORT_ROOT:-./import}:/import:ro
      - ./media:/media:rw
    depends_on:
      db:
        condition: service_healthy

volumes:
  dashcam_db:
  ntfy_data:
